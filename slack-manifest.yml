display_information:
  name: Clockify Bot
  description: Logs your daily Slack updates as Clockify time entries.

features:
  bot_user:
    display_name: clockify-bot
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:write
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    request_url: https://REPLACE_AFTER_DEPLOY.workers.dev
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
